"An input device is where sound comes from: a microphone, a line in, or a virtual input that exists only in PipeWire. Calls and recorders record from the default one; a mic chain processes the microphone and is what they record from. Click a hollow star to make that device the default." = "Un périphérique d'entrée est la source du son : un microphone, une entrée ligne, ou une entrée virtuelle qui n'existe que dans PipeWire. Les appels et les enregistreurs enregistrent depuis celui par défaut ; une chaîne micro traite le microphone et c'est d'elle qu'ils enregistrent. Cliquez sur une étoile vide pour faire de ce périphérique celui par défaut."
"An output device is where sound goes: speakers, headphones, an HDMI screen, or a virtual output that exists only in PipeWire. Apps play into the default one unless Apps sends them elsewhere; an output chain processes the sound before passing it on. Click a hollow star to make that device the default." = "Un périphérique de sortie est la destination du son : haut-parleurs, casque, écran HDMI, ou une sortie virtuelle qui n'existe que dans PipeWire. Les applications jouent vers celui par défaut, sauf si Applications les envoie ailleurs ; une chaîne de sortie traite le son avant de le transmettre. Cliquez sur une étoile vide pour faire de ce périphérique celui par défaut."
