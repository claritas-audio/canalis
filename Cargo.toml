[workspace]
resolver = "3"
members = ["crates/canalis-pw", "crates/canalis-chain", "crates/canalis-pads", "apps/canalis"]
default-members = ["apps/canalis"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Luca Giulianini"]
repository = "https://github.com/claritas-audio/canalis"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
canalis-pw = { path = "crates/canalis-pw" }
canalis-chain = { path = "crates/canalis-chain" }
canalis-pads = { path = "crates/canalis-pads" }
pipewire = { version = "0.10.1", features = ["v1_0_0"] }
libspa = { version = "0.10.1", features = ["v1_0_0"] }
egui = { version = "0.37.0", features = ["default_fonts"] }
eframe = "0.37.0"
anyhow = "1.0.104"
log = "0.4.35"
env_logger = "0.11.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.2.1"
dirs = "7.0.0"
rtrb = "0.4.1"
assert_no_alloc = "1.1.2"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
