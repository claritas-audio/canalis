[package]
name = "canalis"
description = "PipeWire router for the Linux desktop: virtual devices, app routing, patchbay and effect strips"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
canalis-pw.workspace = true
canalis-chain.workspace = true
toml.workspace = true
dirs.workspace = true
egui.workspace = true
eframe.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
egui_extras = { version = "0.37", features = ["svg"] }
resvg = { version = "0.45.1", default-features = false }
ctrlc = { version = "3", features = ["termination"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ureq = "3.5.2"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
