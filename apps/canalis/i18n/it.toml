"An input device is where sound comes from: a microphone, a line in, or a virtual input that exists only in PipeWire. Calls and recorders record from the default one; a mic chain processes the microphone and is what they record from. Click a hollow star to make that device the default." = "Un dispositivo di ingresso è da dove arriva il suono: un microfono, un ingresso di linea o un ingresso virtuale che esiste solo in PipeWire. Chiamate e registratori registrano da quello predefinito; una catena microfono elabora il microfono ed è da essa che registrano. Fai clic su una stella vuota per rendere predefinito quel dispositivo."
"An output device is where sound goes: speakers, headphones, an HDMI screen, or a virtual output that exists only in PipeWire. Apps play into the default one unless Apps sends them elsewhere; an output chain processes the sound before passing it on. Click a hollow star to make that device the default." = "Un dispositivo di uscita è dove va il suono: altoparlanti, cuffie, uno schermo HDMI o un'uscita virtuale che esiste solo in PipeWire. Le app riproducono su quello predefinito, a meno che App non le mandi altrove; una catena di uscita elabora il suono prima di inoltrarlo. Fai clic su una stella vuota per rendere predefinito quel dispositivo."
