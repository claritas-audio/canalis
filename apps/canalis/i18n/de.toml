"An input device is where sound comes from: a microphone, a line in, or a virtual input that exists only in PipeWire. Calls and recorders record from the default one; a mic chain processes the microphone and is what they record from. Click a hollow star to make that device the default." = "Ein Eingabegerät ist die Quelle des Klangs: ein Mikrofon, ein Line-Eingang oder ein virtueller Eingang, der nur in PipeWire existiert. Anrufe und Aufnahmeprogramme nehmen vom Standardgerät auf; eine Mikrofonkette verarbeitet das Mikrofon und ist das, wovon sie aufnehmen. Klicken Sie auf einen leeren Stern, um dieses Gerät zum Standard zu machen."
"An output device is where sound goes: speakers, headphones, an HDMI screen, or a virtual output that exists only in PipeWire. Apps play into the default one unless Apps sends them elsewhere; an output chain processes the sound before passing it on. Click a hollow star to make that device the default." = "Ein Ausgabegerät ist das Ziel des Klangs: Lautsprecher, Kopfhörer, ein HDMI-Bildschirm oder ein virtueller Ausgang, der nur in PipeWire existiert. Apps spielen auf dem Standardgerät ab, sofern „Apps“ sie nicht anderswohin schickt; eine Ausgabekette verarbeitet den Klang, bevor sie ihn weitergibt. Klicken Sie auf einen leeren Stern, um dieses Gerät zum Standard zu machen."
