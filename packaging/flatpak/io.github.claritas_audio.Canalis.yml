# Flathub manifest (packaging/flatpak/SUBMITTING.md). The canalis and claritas repos must be
# public before submission. Every module builds offline: the Cargo crates come from
# *-cargo-sources.json, generated by flatpak-cargo-generator (SUBMITTING.md › Regenerate).
# packaging/flatpak/build-local.sh builds this from the working tree instead of the tag.
app-id: io.github.claritas_audio.Canalis
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm22
command: canalis
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # PipeWire: the control plane and the chains talk to the daemon's socket directly.
  - --filesystem=xdg-run/pipewire-0
  # The user's own plugins; writable so a plugin dropped on the window can be installed.
  - --filesystem=~/.clap
  - --filesystem=~/.lv2
  # Chains exported to share (Export to file) go to ~/Documents/Canalis.
  - --filesystem=xdg-documents/Canalis:create
  # Plugins from Flathub's LinuxAudio extensions (below), then the user's, then the
  # Claritas CLAPs in /app/lib/clap that Canalis finds next to its binaries. lilv expands ~.
  - --env=CLAP_PATH=/app/extensions/Plugins/clap
  - --env=LV2_PATH=~/.lv2:/app/extensions/Plugins/lv2:/app/lib/lv2
add-extensions:
  # `flatpak install flathub org.freedesktop.LinuxAudio.Plugins.LSP//26.08` and the like;
  # Settings › Plugins lists them inside the Flatpak.
  org.freedesktop.LinuxAudio.Plugins:
    directory: extensions/Plugins
    version: '26.08'
    add-ld-path: lib
    merge-dirs: clap;lv2
    subdirectories: true
    no-autodownload: true
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'
modules:
  # LV2: canalis-chain opens lilv and suil at run time (lv2.rs, lv2ui.rs). suil hosts X11
  # UIs only, so no toolkit wrappers are built.
  - name: lv2
    buildsystem: meson
    config-opts: [-Ddocs=disabled, -Dplugins=disabled, -Dtests=disabled, -Donline_docs=false]
    cleanup: [/lib/lv2, /bin]
    sources:
      - type: archive
        url: https://lv2plug.in/spec/lv2-1.18.10.tar.xz
        sha256: 78c51bcf21b54e58bb6329accbb4dae03b2ed79b520f9a01e734bd9de530953f
  - name: zix
    buildsystem: meson
    config-opts: [-Dbenchmarks=disabled, -Ddocs=disabled, -Dtests=disabled, -Dtests_cpp=disabled]
    sources:
      - type: archive
        url: https://download.drobilla.net/zix-0.8.2.tar.xz
        sha256: 4c73aab0f8cbbfe56b00c8c6d648316021e699c5ae6cbf254391ef309047e67b
  - name: serd
    buildsystem: meson
    config-opts: [-Ddocs=disabled, -Dman=disabled, -Dtests=disabled, -Dtools=disabled]
    sources:
      - type: archive
        url: https://download.drobilla.net/serd-0.32.10.tar.xz
        sha256: b0e93b49e52f01a049475b7886ef140407115a32d3b1e5dc5f95141c88275d1c
  - name: sord
    buildsystem: meson
    config-opts: [-Ddocs=disabled, -Dman=disabled, -Dtests=disabled, -Dtools=disabled]
    sources:
      - type: archive
        url: https://download.drobilla.net/sord-0.16.22.tar.xz
        sha256: bb23b34b216579136795d518cffa73d91cf205594ce9accebfd408afb839173f
  - name: sratom
    buildsystem: meson
    config-opts: [-Ddocs=disabled, -Dtests=disabled]
    sources:
      - type: archive
        url: https://download.drobilla.net/sratom-0.6.22.tar.xz
        sha256: 0209b7d0f22c96abb416722ed735b0933be47931ecff4aa4b26ded7760b4f252
  - name: lilv
    buildsystem: meson
    config-opts: [-Dbindings_py=disabled, -Dbindings_cpp=disabled, -Ddocs=disabled, -Dtests=disabled, -Dtools=disabled]
    sources:
      - type: archive
        url: https://download.drobilla.net/lilv-0.28.0.tar.xz
        sha256: 8dcb70adb5cf072335115a6b091f4113710bdc73abaadaa3f9e9c1e55957b149
  - name: suil
    buildsystem: meson
    config-opts: [-Dcocoa=disabled, -Ddocs=disabled, -Dgtk2=disabled, -Dgtk3=disabled, -Dqt5=disabled, -Dqt6=disabled, -Dtests=disabled]
    sources:
      - type: archive
        url: https://download.drobilla.net/suil-0.10.26.tar.xz
        sha256: 62808916602c47d201a1ec2d246323a8048243f2bf972f859f0db1db4662ee43
  # The Claritas CLAPs Canalis ships with (ADR 0007), into /app/lib/clap, where canalis and
  # canalis-chain look (<bin>/../lib/clap). Same commit as scripts/bundle-claritas.sh.
  - name: claritas
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/claritas/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo xtask bundle claritas-eq --release
      - cargo xtask bundle claritas-comp --release
      - install -Dm755 -t /app/lib/clap "target/bundled/Claritas EQ.clap" "target/bundled/Claritas Comp.clap"
    sources:
      - type: git
        url: https://github.com/claritas-audio/claritas.git
        commit: 1a57f8e368c2ecca4a29b2a66e7844463e421d25
      - claritas-cargo-sources.json
  - name: canalis
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/canalis/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --locked --offline -p canalis -p canalis-chain
      - install -Dm755 -t /app/bin target/release/canalis target/release/canalis-chain
      # The Flathub extension point for the plugin extensions above.
      - install -d /app/extensions/Plugins
      - install -Dm644 packaging/flatpak/io.github.claritas_audio.Canalis.desktop /app/share/applications/io.github.claritas_audio.Canalis.desktop
      - install -Dm644 packaging/flatpak/io.github.claritas_audio.Canalis.metainfo.xml /app/share/metainfo/io.github.claritas_audio.Canalis.metainfo.xml
      - install -Dm644 assets/canalis-app-icon.svg /app/share/icons/hicolor/scalable/apps/io.github.claritas_audio.Canalis.svg
    sources:
      - type: git
        url: https://github.com/claritas-audio/canalis.git
        tag: v0.2.1
        commit: 5e59f01e35d14ce4a9a3226b7c643b2a78c70b49
      - cargo-sources.json
