"Apps may use CPUs {allowed} only, not the performance cores {performance}; that is usually intel_lpmd in the balanced or power-saver profile. Heavy plugins such as denoisers can then crackle or get the chain stopped. Use the performance profile, or turn intel_lpmd off: `sudo systemctl disable --now intel_lpmd`" = "Apps dürfen nur die CPUs {allowed} nutzen, nicht die Performance-Kerne {performance}; meist liegt das an intel_lpmd im ausgewogenen oder Energiespar-Profil. Rechenintensive Plugins wie Entrauscher können dann knacksen oder die Kette zum Anhalten bringen. Verwenden Sie das Leistungsprofil oder schalten Sie intel_lpmd ab: `sudo systemctl disable --now intel_lpmd`"
