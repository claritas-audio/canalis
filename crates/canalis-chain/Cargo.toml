[package]
name = "canalis-chain"
description = "Audio plane: one effect chain as a PipeWire capture+playback stream pair, run in its own process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pipewire.workspace = true
rtrb.workspace = true
assert_no_alloc.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "params", "audio-ports", "latency", "log", "gui", "state"] }
x11rb = "0.13"
base64 = "0.22"
libc = "0.2"
libloading = "0.8"
realfft = "3.5.1"
lv2_raw = "0.3"
lv2-sys = "2"

[[bin]]
name = "canalis-chain"
path = "src/main.rs"

[lints]
workspace = true
